<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cinex</title>
<link rel="stylesheet" href="/static/guia.css">
</head>
<body>
<div class="g">
  <!-- steps (Notion sidebar) -->
  <aside class="side">
    <div class="brand"><span class="logo" aria-hidden="true"></span><b>Cinex</b><span class="muted">edição com IA</span></div>
    <div class="proj">
      <select id="gproj" aria-label="Vídeo"></select>
      <button id="gnew" class="ghost" title="Começar um vídeo novo">＋</button>
    </div>
    <div class="sidelabel">Passo a passo</div>
    <nav id="gsteps" class="steps" aria-label="Passos"></nav>
    <div class="sidefoot">
      <a id="geditor" class="ghostlink" href="/editor" title="Linha do tempo e todas as ferramentas, para ajustes finos">Editor completo ↗</a>
    </div>
  </aside>

  <!-- the current step's page -->
  <main class="page">
    <div class="pagewrap">
      <article id="gpage" class="pagebody"></article>
      <div id="gpv" class="pv" hidden><iframe id="gframe" title="Prévia do vídeo"></iframe></div>
    </div>
  </main>

  <!-- chat with the AI: always there -->
  <section class="chat" aria-label="Conversa com o Cinex">
    <header class="chathead"><b>Conversa</b><span class="muted">com o Cinex</span></header>
    <div id="gmsgs" class="msgs" aria-live="polite"></div>
    <div id="gstatus" class="status" hidden></div>
    <div id="gchips" class="chips"></div>
    <form id="gform" class="composer">
      <textarea id="gin" rows="1" placeholder="Peça qualquer ajuste…" aria-label="Mensagem"></textarea>
      <div class="composerbar">
        <button type="button" id="gmic" class="mic" title="Falar: toque para começar e de novo para enviar" aria-label="Falar">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z" fill="currentColor"/></svg>
          <span id="gmiclabel">Falar</span>
        </button>
        <span class="spacer"></span>
        <button id="gsend" class="send" aria-label="Enviar">Enviar ↵</button>
      </div>
    </form>
  </section>
</div>
<input type="file" id="gfile" accept="video/*,.mov,.mp4,.m4v" hidden>
<input type="file" id="gfiles" accept="video/*,.mov,.mp4,.m4v" multiple hidden>
<input type="file" id="gaudio" accept="audio/*,.mp3,.wav,.m4a" hidden>
<script src="/static/guia.js"></script>
</body>
</html>
